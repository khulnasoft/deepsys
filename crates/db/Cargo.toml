[package]
name = "db"
version = "0.1.0"
edition = "2024"

[dependencies]
# Core types
deepsys-types = { path = "../types" }

# Async runtime
tokio = { version = "1.0", features = ["fs", "io-util"] }
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
