[package]
name = "deepsys-types"
version = "0.1.0"
edition = "2024"
description = "Core type definitions for Deepsys security scanner"
authors = ["DeepSys Team"]
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
regex = "1.0"
num_cpus = "1.0"
