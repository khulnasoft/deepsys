[package]
name = "deepsys-cache"
version = "0.1.0"
edition = "2024"
description = "Caching system for Deepsys security scanner"
authors = ["DeepSys Team"]
license = "Apache-2.0"

[dependencies]
# Core types
deepsys-types = { path = "../types" }

# Async runtime
tokio = { version = "1.0", features = ["fs", "io-util", "time"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Caching backends
sled = "0.34"  # Embedded database for persistent cache
dashmap = "5.0"  # Concurrent HashMap for in-memory cache

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Hashing for cache keys
sha2 = "0.10"
hex = "0.4"

# Logging
tracing = "0.1"

# Utilities
once_cell = "1.0"
rand = "0.8"
