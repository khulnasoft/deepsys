[package]
name = "deepsys-misconf"
version = "0.1.0"
edition = "2024"
description = "Misconfiguration detection for Deepsys security scanner"
authors = ["DeepSys Team"]
license = "Apache-2.0"

[dependencies]
# Core types
deepsys-types = { path = "../types" }
deepsys-sast = { path = "../sast" }

# Async runtime
tokio = { version = "1.0", features = ["fs", "io-util"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# YAML/JSON parsing for configuration analysis
yaml-rust = "0.4"
json5 = "0.4"

# Regular expressions for pattern matching
regex = "1.0"

# File processing
walkdir = "2.0"

# Logging
tracing = "0.1"

# Utilities
once_cell = "1.0"
rayon = "1.0"  # For parallel processing
num_cpus = "1.0"

# Kubernetes parsing
kube = { version = "0.87", features = ["client", "derive"] }

# Docker parsing
dockerfile-parser = "0.8"
