[package]
name = "deepsys-sast"
version = "0.1.0"
edition = "2024"
description = "Core artifact analysis engine for Deepsys security scanner"
authors = ["DeepSys Team"]
license = "Apache-2.0"

[dependencies]
# Core types
deepsys-types = { path = "../types" }

# Async runtime
tokio = { version = "1.0", features = ["fs", "io-util"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"

# Utilities
regex = "1.0"
walkdir = "2.0"
