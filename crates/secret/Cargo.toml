[package]
name = "deepsys-secret"
version = "0.1.0"
edition = "2024"
description = "Secret and credential detection for Deepsys security scanner"
authors = ["DeepSys Team"]
license = "Apache-2.0"

[dependencies]
# Core types
deepsys-types = { path = "../types" }
deepsys-sast = { path = "../sast" }

# Async runtime
tokio = { version = "1.0", features = ["fs", "io-util"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Regular expressions for pattern matching
regex = "1.0"

# Text processing and entropy calculation
unicode-segmentation = "1.0"

# File processing
walkdir = "2.0"

# Hashing for checksums
sha2 = "0.10"
md5 = "0.7"

# Logging
tracing = "0.1"

# Utilities
once_cell = "1.0"
rayon = "1.0"  # For parallel processing
num_cpus = "1.0"
