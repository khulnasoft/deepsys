[package]
name = "deepsys-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line interface for Deepsys security scanner"
authors = ["DeepSys Team"]
license = "Apache-2.0"

[dependencies]
# Core types and functionality
deepsys-types = { path = "../types" }
deepsys-sast = { path = "../sast" }

# CLI framework
clap = { version = "4.0", features = ["derive", "color", "suggestions"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Configuration
config = "0.14"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
regex = "1.0"
walkdir = "2.0"
